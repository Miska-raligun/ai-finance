<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Anon 助手头像">
  <!-- 圆脸暖橘底 -->
  <circle cx="32" cy="32" r="30" fill="#f8a6b2"/>
  <!-- 耳朵 / 头发 -->
  <ellipse cx="14" cy="22" rx="9" ry="11" fill="#f7cd67" transform="rotate(-30 14 22)"/>
  <ellipse cx="50" cy="22" rx="9" ry="11" fill="#f7cd67" transform="rotate(30 50 22)"/>
  <!-- 脸颊腮红 -->
  <ellipse cx="20" cy="40" rx="5" ry="3" fill="#fc736d" opacity="0.55"/>
  <ellipse cx="44" cy="40" rx="5" ry="3" fill="#fc736d" opacity="0.55"/>
  <!-- 大眼睛 -->
  <ellipse cx="24" cy="32" rx="3.5" ry="4.5" fill="#3b2419"/>
  <ellipse cx="40" cy="32" rx="3.5" ry="4.5" fill="#3b2419"/>
  <circle cx="25.5" cy="30.5" r="1.3" fill="#fff"/>
  <circle cx="41.5" cy="30.5" r="1.3" fill="#fff"/>
  <!-- 微笑 -->
  <path d="M26 44 Q 32 49 38 44" stroke="#3b2419" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 头顶小叶子（动森员标志） -->
  <path d="M32 5 Q 28 0 32 0 Q 36 0 32 5 Z" fill="#6fba2c"/>
</svg>
