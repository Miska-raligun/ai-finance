  <circle cx="16" cy="16" r="5" fill="#794f27"/>
  <circle cx="48" cy="16" r="5" fill="#794f27"/>
  <circle cx="16" cy="16" r="2.6" fill="#3b2419"/>
  <circle cx="48" cy="16" r="2.6" fill="#3b2419"/>
  <!-- 圆脸（深棕） -->
  <ellipse cx="32" cy="38" rx="22" ry="20" fill="#9a835a"/>
  <!-- 圆鼻区（浅色椭圆） -->
  <ellipse cx="32" cy="42" rx="13" ry="11" fill="#e5cfa1"/>
  <!-- 眼睛 -->
  <ellipse cx="24" cy="32" rx="2.4" ry="3" fill="#3b2419"/>
  <ellipse cx="40" cy="32" rx="2.4" ry="3" fill="#3b2419"/>
  <circle cx="25" cy="31" r="0.9" fill="#fff"/>
  <circle cx="41" cy="31" r="0.9" fill="#fff"/>
  <!-- 大门牙 -->
  <rect x="29" y="44" width="3" height="6" fill="#fff" stroke="#3b2419" stroke-width="0.7"/>
  <rect x="32" y="44" width="3" height="6" fill="#fff" stroke="#3b2419" stroke-width="0.7"/>
  <!-- 黑鼻 -->
  <ellipse cx="32" cy="40" rx="2.2" ry="1.5" fill="#3b2419"/>
  <!-- 腮红 -->
  <ellipse cx="14" cy="42" rx="2.5" ry="1.5" fill="#fc736d" opacity="0.5"/>
  <ellipse cx="50" cy="42" rx="2.5" ry="1.5" fill="#fc736d" opacity="0.5"/>
</svg>
